<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" width="1800" height="1180" role="img" aria-labelledby="title desc">
<title id="title">Ramkarta — falsifierbar brief</title>
<desc id="desc">Ram → två ledfrågor → riktning, praktik, motargument, metod, katalog (N=96). Teman är endast routing.</desc>
<defs>
  <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1f2e" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#1f5c4a"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#f7f5f0"/>

<text x="80" y="72" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1a1f2e" letter-spacing="-0.5">Ramkarta — falsifierbar brief</text>
<text x="80" y="108" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#5c6578">Inte ett bibliotek. Teman är endast routing — vägvisare till evidens och beslut.</text>

<rect x="80" y="150" width="1640" height="110" rx="14" fill="#ffffff" stroke="#1f5c4a" stroke-width="2.5" filter="url(#sh)"/>
<text x="120" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1f5c4a" letter-spacing="1.5">RAM</text>
<text x="120" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1a1f2e">Människans lärande i en tid av digitala intelligenser.</text>

<line x1="900.0" y1="268" x2="900.0" y2="308" stroke="#1f5c4a" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="80" y="340" width="780" height="100" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="116" cy="390" r="18" fill="#e6f0ec"/>
<text x="116" y="396" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f5c4a">1</text>
<text x="148" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#5c6578" letter-spacing="1">LEDFRÅGA 1</text>
<text x="148" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e">Vad är optimalt lärande?</text>

<rect x="900" y="340" width="780" height="100" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="936" cy="390" r="18" fill="#e6f0ec"/>
<text x="936" y="396" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f5c4a">2</text>
<text x="968" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#5c6578" letter-spacing="1">LEDFRÅGA 2</text>
<text x="968" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e">Hur när AI och skärmar redan är överallt?</text>

<line x1="900.0" y1="448" x2="900.0" y2="488" stroke="#1f5c4a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="900.0" y="512" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#5c6578">Routing — välj destination efter beslutbehov</text>

<rect x="110.0" y="560" width="300" height="160" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5" filter="url(#sh)"/>
<rect x="110.0" y="560" width="300" height="6" rx="3" fill="#1f5c4a"/>
<text x="260.0" y="608" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e">Riktning</text>
<text x="260.0" y="642" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">Hållning — vad banken säger</text>
<text x="260.0" y="668" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">och vad den inte säger</text>

<rect x="430.0" y="560" width="300" height="160" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5" filter="url(#sh)"/>
<rect x="430.0" y="560" width="300" height="6" rx="3" fill="#1f5c4a"/>
<text x="580.0" y="608" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e">Praktik</text>
<text x="580.0" y="642" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">Stop / Start / Measure</text>
<text x="580.0" y="668" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">per stadium (F–gymnasium)</text>

<rect x="750.0" y="560" width="300" height="160" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5" filter="url(#sh)"/>
<rect x="750.0" y="560" width="300" height="6" rx="3" fill="#1f5c4a"/>
<text x="900.0" y="608" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e">Motargument</text>
<text x="900.0" y="642" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">Steelman — starkaste</text>
<text x="900.0" y="668" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">motstående läsningar</text>

<rect x="1070.0" y="560" width="300" height="160" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5" filter="url(#sh)"/>
<rect x="1070.0" y="560" width="300" height="6" rx="3" fill="#1f5c4a"/>
<text x="1220.0" y="608" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e">Metod</text>
<text x="1220.0" y="642" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">Inklusionsregel, tiers,</text>
<text x="1220.0" y="668" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">falsifierbarhetskrav</text>

<rect x="1390.0" y="560" width="300" height="160" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5" filter="url(#sh)"/>
<rect x="1390.0" y="560" width="300" height="6" rx="3" fill="#8b4513"/>
<text x="1540.0" y="608" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e">Katalog</text>
<text x="1540.0" y="642" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">Unikt N = 96</text>
<text x="1540.0" y="668" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5c6578">källor (ej multi-tag)</text>

<rect x="80" y="780" width="1640" height="320" rx="14" fill="#ffffff" stroke="#e2ddd3" stroke-width="1.5"/>
<text x="120" y="830" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1a1f2e">Vad «falsifierbar brief» betyder</text>
<text x="120" y="870" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#5c6578">• Varje hållning ska kunna brytas av ny evidens — inte samla mer text.</text>
<text x="120" y="905" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#5c6578">• Teman (AI, papper/skärm, …) är routinglabels, inte separata sanningar.</text>
<text x="120" y="940" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#5c6578">• Load-bearing källor (Bastani, Delgado, IFAU, ITS-meta, Abrahamsson) väger tyngre än position papers.</text>
<text x="120" y="975" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#5c6578">• Mät encodingvillkor (distraktionsfri tid, closed-book) — inte policyetiketter.</text>
<text x="120" y="1030" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c6578">Kunskapsbank lärande · rektor-vänlig översikt · N=96 unika källor</text>
<text x="120" y="1060" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6578">js22gz.github.io/kunskapsbank-larande</text>
</svg>
